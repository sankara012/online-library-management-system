<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --primary: #3b82f6;
  --accent: #22c55e;
  --text: #e2e8f0;
  --muted: #94a3b8;
  --border: #334155;
}

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* BODY */
body {
  font-family: 'Poppins', sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* HEADER */
.header {
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 30px;
  background: rgba(15, 23, 42, 0.8);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}

.header h2 {
  font-weight: 500;
}

/* LAYOUT */
.container {
  display: flex;
}

/* SIDEBAR */
.sidebar {
  width: 220px;
  height: calc(100vh - 70px);
  border-right: 1px solid var(--border);
  padding: 20px;
}

.sidebar ul {
  list-style: none;
}

.sidebar li {
  margin-bottom: 15px;
  color: var(--muted);
  cursor: pointer;
  transition: 0.3s;
}

.sidebar li:hover {
  color: var(--primary);
}

/* MAIN CONTENT */
.main {
  flex: 1;
  padding: 30px;
}

/* PROFILE LAYOUT */
.profile {
  display: flex;
  gap: 30px;
  flex-wrap: wrap;
}

/* CARD */
.card {
  background: var(--card);
  padding: 25px;
  border-radius: 12px;
  border: 1px solid var(--border);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-5px);
}

/* PROFILE CARD */
.profile-card {
  text-align: center;
  width: 260px;
}

.profile-card img {
  width: 100px;
  height: 100px;
  object-fit: cover;
  border-radius: 50%;
  border: 3px solid var(--primary);
  margin-bottom: 15px;
  transition: 0.3s;
}

.profile-card img:hover {
  transform: scale(1.08);
  box-shadow: 0 0 20px var(--primary);
}

.profile-card h3 {
  margin-bottom: 5px;
}

.profile-card p {
  color: var(--muted);
}

/* BUTTON */
.btn {
  margin-top: 15px;
  background: var(--primary);
  color: white;
  padding: 10px 18px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  transition: 0.3s;
}

.btn:hover {
  background: #2563eb;
  transform: translateY(-2px);
}

/* INFO GRID */
.info-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  flex: 1;
}

/* HEADINGS */
.card h2 {
  font-size: 18px;
  margin-bottom: 15px;
}

/* TEXT */
p {
  color: var(--muted);
  margin-bottom: 8px;
}

/* BORROWED BOOKS LIST */
.borrowed-list li {
  margin-bottom: 10px;
  color: var(--text);
  list-style: none;
}

.borrowed-list li span {
  color: var(--muted);
  font-size: 0.85em;
  display: block;
}

/* LINKS */
a {
  color: var(--primary);
  text-decoration: none;
  transition: 0.3s;
}

a:hover {
  opacity: 0.8;
}
    
.sidebar a.active {
  color: var(--primary);
  font-weight: 500;
}
    
.sidebar a {
  text-decoration: none;
  color: var(--muted);
  display: block;
}

.sidebar a:hover {
  color: var(--primary);
}    

.borrowed-list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}

.return-btn {
    background: #ef4444;
    padding: 6px 12px;
    font-size: 0.85em;
}

.return-btn:hover {
    background: #dc2626;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <h2>Dashboard</h2>
  <p id="headerName" style="margin: 0;font-weight: 500;font-size: 1.1em;color: var(--text);">Loading...</p>
</div>

<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <ul>
        <li><a href="#" onclick="window.scrollTo({top: 0, behavior: 'smooth'}); return false;">Overview</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="EditProfile.html">Edit Profile</a></li>
        <li><a href="change-password.html">Change Password</a></li>
        <li><a href="#" id="logoutLink">Logout</a></li>
        <li><a href="index.html">Home</a></li>
    </ul>
  </div>

  <!-- MAIN -->
  <div class="main">

    <div class="profile">

      <!-- PROFILE CARD -->
      <div class="card profile-card">
        <img src="assets/images/profile.jpg" id="dashboardAvatar">
        <h3 id="profileCardName">Loading...</h3>
        <p>Library Member</p>
        <a href="profile.html" class="btn">Back to Profile</a>
      </div>

      <!-- INFO SECTION -->
      <div class="info-grid">

        <div class="card">
          <h2>Personal Info</h2>
          <p>Email: <span id="dashboardEmail">Loading...</span></p>
          <p>Member Since: <span id="dashboardJoined">Loading...</span></p>
        </div>

        <div class="card">
          <h2>Quick Stats</h2>
          <p>Books Borrowed: <span id="statsTotalBorrowed">0</span></p>
        </div>

        <div class="card">
          <h2>My Borrowed Books</h2>
          <ul class="borrowed-list" id="borrowedList">
            <!-- Filled in by JavaScript -->
          </ul>
        </div>

      </div>

    </div>

  </div>

</div>

<script src="js/main.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
