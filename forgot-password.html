<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forgot-password</title>
    <link rel="stylesheet" href="css/forgot-password.css">
</head>
<body>
    <div class="heading">
        <h1>
            Do not remember your password anymore? 
        </h1>
        <p>Don't worry, fill out the below form to reset it.</p>
    </div>
    <div class="container">
        <form id="forgotPasswordForm">
                <label for="email">Email</label><br>
                <input type="email" id="email" name="email" required><br><br>
                <label for="newPassword">New Password</label><br>
                <input type="password" id="newPassword" name="newPassword" required><br><br>
                <label for="confirmNewPassword">Confirm New Password</label><br>
                <input type="password" id="confirmNewPassword" name="confirmNewPassword" required><br><br>
                <p id="forgotPasswordMessage" class="error-message"></p>
                <input type="submit" value="Reset Password" class="btn">
        </form>
    </div>

    <script src="js/forgot-password.js"></script>
</body>
</html>
