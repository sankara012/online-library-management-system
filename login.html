<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo"><img src="assets/images/logo.jpg" alt="Online Library Logo"/></a>
    </header>

    <div class="login-container">
        <h1>Welcome back to the Online Library</h1>
        <p>Login to Your Account</p>
        <form action="dashboard.html" method="post">
            <label for="username">Username:</label><br>
            <input type="text" id="username" name="username" required><br><br>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required><br><br>
            <input type="submit" value="Login" class="btn">
        </form>
        <p>Forgot your <a href="forgot-password.html">password</a>?</p>
        <p>Don't have an account? <a href="register.html">Register</a></p>
    </div>
        

    <footer>
        <div class="footer-content">
            <h3>Online Library System</h3>
            <p>Your gateway to a world of knowledge and literature.</p>
            <ul class="socials">
                <li><a href="#"><img src="assets/images/instagram.jpg" alt="instagram"/></a></li>
                <li><a href="#"><img src="assets/images/linkedin.png" alt="linkedin"/></a></li> 
                <li><a href="#"><img src="assets/images/facebook.png" alt="facebook"/></a></li>
                <li><a href="#"><img src="assets/images/twitter.png" alt="twitter"/></a></li>
            </ul>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Online Library System. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
