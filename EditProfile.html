    </header>
    <div class="page-header">
        <h1>Edit Profile </h1>
        <p> Update your personal informations</p>
    </div>
    <section class="card-container">
            <div class="profile-avatar-edit">
                <img src="assets/images/profile.jpg" alt="Profile Image" id="avatarPreview"/>
            </div>
            <input type="file" id="imageInput" accept="image/*" style="display: none;">
            <button type="button" class="btn" id="bt">Change Image</button>
            <div class="edit-profile-page">
                <form id="editProfileForm">
                    <div class="form-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" name="fullname" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <p id="editProfileMessage" class="error-message"></p>
                    <div class="form-actions">
                        <button type="submit" class="btn">Save Changes</button>
                        <button type="button" class="btn btn-secondary">Cancel</button>
                    </div>  
                </form>  
                </div>
    
  </section>
